name: Mandate CI
on:
  push:
    branches: ["main", "*"]
  pull_request:
    branches: ["main"]
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --no-deps paypal-agent-toolkit
      - name: Ruff lint
        run: ruff check packages adapters apps tests
      - name: Run pytest & hypothesis suite
        run: pytest -v
