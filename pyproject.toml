[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-backend"
version = "1.0.0"
description = "Mandate: Deterministic AI Agent Spending Firewall & Cryptographic Audit Ledger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.28.0",
  "requests>=2.32.0",
  "google-auth>=2.35.0",
  "google-genai>=2.30.1",
  "groq>=0.15.0",
  "channel3-sdk>=0.1.0",
]

[project.optional-dependencies]
paypal-toolkit = [
  "paypal-agent-toolkit>=1.0.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "hypothesis>=6.120.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["packages/core", "."]
include = ["mandate_core*", "adapters*", "apps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["packages/core", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
