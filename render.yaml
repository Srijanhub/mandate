services:
  - type: web
    name: mandate-api
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install . && pip install --no-deps paypal-agent-toolkit
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: REQUIRE_AUTH
        value: "true"
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: API_ADMIN_TOKEN
        generateValue: true
      - key: API_USER_TOKEN
        generateValue: true
      - key: AUTH_ALLOW_DEMO_MODE
        value: "false"
      - key: AUTH_EXPOSE_DEMO_OTP
        value: "false"
      - key: ENABLE_DEMO_LAB
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

databases:
  - name: mandate-db
    plan: starter
    databaseName: mandate
    user: mandate
