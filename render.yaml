services:
  - type: web
    name: mandate-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install . && pip install --no-deps paypal-agent-toolkit
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: REQUIRE_AUTH
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTH_ALLOW_DEMO_MODE
        value: "true"
      - key: AUTH_EXPOSE_DEMO_OTP
        value: "true"
      - key: ENABLE_DEMO_LAB
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/mandate.db
      - key: PAYPAL_MODE
        value: sandbox
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
